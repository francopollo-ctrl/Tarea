{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-4">{{ action }} usuario</h3>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Nombre</label>
            <input type="text" name="nombre" class="form-control" value="{{ user.nombre or '' }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" name="email" class="form-control" value="{{ user.email or '' }}" required>
          </div>
          {% if action == 'Crear' %}
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" required>
          </div>
          {% endif %}
          <div class="mb-3">
            <label class="form-label">Rol</label>
            <select name="rol" class="form-select">
              <option value="usuario" {% if user.rol == 'usuario' %}selected{% endif %}>usuario</option>
              <option value="admin" {% if user.rol == 'admin' %}selected{% endif %}>admin</option>
            </select>
          </div>
          <button type="submit" class="btn btn-success">Guardar</button>
          <a class="btn btn-secondary" href="{{ url_for('users_list') }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
