{% extends 'layout.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="card-title mb-4">Eliminar usuario</h3>
        <p>¿Estás seguro que deseas eliminar el usuario <strong>{{ user.nombre }}</strong> (<em>{{ user.email }}</em>)?</p>
        <form method="post">
          <button type="submit" class="btn btn-danger">Sí, eliminar</button>
          <a class="btn btn-secondary" href="{{ url_for('users_list') }}">Cancelar</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
